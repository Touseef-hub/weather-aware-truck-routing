# Render Blueprint: deploys the Django API as a free web service.
# The frontend is deployed separately (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # A plan makes several OSRM + weather calls, so allow more than gunicorn's 30s default.
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set in the dashboard to your Vercel URL
      - key: GEOCODER_USER_AGENT
        sync: false # e.g. "truck-routing/1.0 (contact: you@example.com)"
